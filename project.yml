name: DandelionIOS
options:
  bundleIdPrefix: nl.ostconsultancy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
targets:
  DandelionIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DandelionIOS
    info:
      path: DandelionIOS/Info.plist
      properties:
        CFBundleDisplayName: Dandelion
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleIconName: AppIcon
        NSHumanReadableCopyright: "Copyright © 2026 OST Consultancy"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.ostconsultancy.DandelionIOS
        PRODUCT_NAME: DandelionIOS
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
