name: DandelionIOS
options:
  bundleIdPrefix: nl.ostconsultancy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  disableAutogeneratedSchemes: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
targets:
  DandelionIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DandelionIOS
      - path: DandelionShared
    info:
      path: DandelionIOS/Info.plist
      properties:
        CFBundleDisplayName: Dandelion
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        CFBundleIconName: AppIcon
        NSHumanReadableCopyright: "Copyright © 2026 OST Consultancy"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - dandelion
    entitlements:
      path: DandelionIOS/DandelionIOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.nl.ostconsultancy.Dandelion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.ostconsultancy.DandelionIOS
        PRODUCT_NAME: DandelionIOS
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: DandelionWidgetExtension

  DandelionWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DandelionWidget
      - path: DandelionShared
    info:
      path: DandelionWidget/Info.plist
      properties:
        CFBundleDisplayName: DandelionWidget
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: DandelionWidget/DandelionWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.nl.ostconsultancy.Dandelion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.ostconsultancy.DandelionIOS.DandelionWidget
        PRODUCT_NAME: DandelionWidget
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic

schemes:
  DandelionIOS:
    build:
      targets:
        DandelionIOS: all
    run:
      debugBundleGeneration: YES
